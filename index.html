<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Canva Ripper</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; background: #111; color: #fff; }
        input { padding: 10px; width: 300px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; cursor: pointer; background: #0070f3; color: white; border: none; border-radius: 5px; }
        #output { margin-top: 20px; width: 100%; height: 400px; background: #222; color: #0f0; }
    </style>
</head>
<body>
    <h1>Canva Site Cleaner</h1>
    <input type="text" id="url" placeholder="something.my.canva.site">
    <button onclick="process()">Get Clean Code</button>
    <textarea id="output" placeholder="Cleaned HTML will appear here..."></textarea>

    <script>
        async function process() {
            const url = document.getElementById('url').value;
            const res = await fetch('/api/clean', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ url })
            });
            const data = await res.json();
            document.getElementById('output').value = data.html || data.error;
        }
    </script>
</body>
</html>
